<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #11182b;
      border-right: 1px solid #26304a;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .new-chat:hover {
      background: #1d4ed8;
    }

    .history-title {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 10px;
    }

    #history {
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      color: #d1d5db;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: #1d2740;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid #26304a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #0f172a;
    }

    .topbar-title {
      font-weight: bold;
      font-size: 18px;
    }

    select {
      background: #18223a;
      color: white;
      border: 1px solid #334155;
      padding: 8px 10px;
      border-radius: 8px;
      outline: none;
    }

    /* Chat */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9ca3af;
      line-height: 1.6;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px auto;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
    }

    .assistant .bubble {
      background: #18223a;
      border: 1px solid #293653;
    }

    .typing {
      color: #9ca3af;
      font-style: italic;
    }

    /* Composer */
    .composer-area {
      padding: 15px 20px 20px;
      border-top: 1px solid #26304a;
      background: #0f172a;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #18223a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 8px;
    }

    .composer input[type="text"] {
      flex: 1;
      background: transparent;
      border: 0;
      outline: none;
      color: white;
      font-size: 16px;
      padding: 10px;
      min-width: 0;
    }

    .composer input[type="text"]::placeholder {
      color: #64748b;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      color: #cbd5e1;
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 9px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: #26334f;
    }

    .send-btn {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 9px;
      width: 45px;
      height: 40px;
      cursor: pointer;
      font-size: 18px;
    }

    .send-btn:hover {
      background: #1d4ed8;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #fileInput {
      display: none;
    }

    .file-name {
      max-width: 900px;
      margin: 8px auto 0;
      color: #94a3b8;
      font-size: 13px;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 12px;
      }

      #chat {
        padding: 15px 10px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome {
        margin: 80px 15px;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .composer-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">⚡ Crazy Assistant</div>

    <button class="new-chat" id="newChatBtn">
      ＋ New Chat
    </button>

    <div class="history-title">CHAT HISTORY</div>
    <div id="history"></div>
  </aside>

  <!-- Main -->
  <main class="main">

    <header class="topbar">
      <div class="topbar-title">Crazy Assistant</div>

      <select id="modeSelect">
        <option value="assistant">Assistant</option>
        <option value="coding">Coding</option>
        <option value="study">Study</option>
        <option value="creative">Creative</option>
        <option value="gaming">Gaming</option>
      </select>
    </header>

    <!-- Chat -->
    <section id="chat">

      <div class="welcome" id="welcome">
        <h1>How can I help you?</h1>
        <p>
          Ask me anything. I can help with coding, websites,
          studying, ideas, gaming and more.
        </p>
      </div>

    </section>

    <!-- Composer -->
    <div class="composer-area">

      <div class="composer">

        <label class="icon-btn" title="Upload file">
          ＋
          <input type="file" id="fileInput"
                 accept="image/*,.pdf,.txt,.doc,.docx">
        </label>

        <input
          type="text"
          id="messageInput"
          placeholder="Message Crazy Assistant..."
          autocomplete="off"
        >

        <button class="icon-btn" id="voiceBtn" title="Voice">
          🎤
        </button>

        <button class="send-btn" id="sendBtn" title="Send">
          ➤
        </button>

      </div>

      <div class="file-name" id="fileName"></div>

    </div>

  </main>
</div>


<script>
  // ==============================
  // CRAZY ASSISTANT
  // ==============================

  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const newChatBtn = document.getElementById("newChatBtn");
  const historyBox = document.getElementById("history");
  const fileInput = document.getElementById("fileInput");
  const fileName = document.getElementById("fileName");
  const modeSelect = document.getElementById("modeSelect");
  const welcome = document.getElementById("welcome");

  let messages = [];
  let selectedFile = null;
  let isSending = false;


  // ==============================
  // LOAD HISTORY
  // ==============================

  function loadHistory() {
    try {
      const saved = localStorage.getItem("crazyAssistantMessages");

      if (saved) {
        messages = JSON.parse(saved);
      }
    } catch (error) {
      messages = [];
    }

    renderChat();
  }


  // ==============================
  // SAVE HISTORY
  // ==============================

  function saveHistory() {
    localStorage.setItem(
      "crazyAssistantMessages",
      JSON.stringify(messages)
    );
  }


  // ==============================
  // RENDER CHAT
  // ==============================

  function renderChat() {

    chat.innerHTML = "";

    if (messages.length === 0) {
      chat.appendChild(welcome);
      welcome.style.display = "block";
      return;
    }

    welcome.style.display = "none";

    messages.forEach(function(msg) {
      addMessageToScreen(msg.role, msg.content, false);
    });

    scrollBottom();
  }


  // ==============================
  // ADD MESSAGE
  // ==============================

  function addMessageToScreen(role, text, save = true) {

    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);

    if (save) {
      scrollBottom();
    }
  }


  // ==============================
  // SCROLL
  // ==============================

  function scrollBottom() {
    setTimeout(function() {
      chat.scrollTop = chat.scrollHeight;
    }, 50);
  }


  // ==============================
  // SEND MESSAGE
  // ==============================

  async function sendMessage() {

    if (isSending) return;

    const text = input.value.trim();

    if (!text && !selectedFile) {
      return;
    }

    isSending = true;
    sendBtn.disabled = true;

    const previousHistory = messages.slice(-12);

    let displayText = text;

    if (!displayText && selectedFile) {
      displayText = "Please analyze this file.";
    }

    // User message
    messages.push({
      role: "user",
      content: displayText
    });

    addMessageToScreen("user", displayText);

    input.value = "";

    // Typing indicator
    const typingWrapper = document.createElement("div");
    typingWrapper.className = "message assistant";

    const typingBubble = document.createElement("div");
    typingBubble.className = "bubble typing";
    typingBubble.textContent = "Crazy Assistant is typing...";

    typingWrapper.appendChild(typingBubble);
    chat.appendChild(typingWrapper);

    scrollBottom();


    try {

      const payload = {
        message: text || "Please analyze this file.",
        history: previousHistory,
        mode: modeSelect.value,
        persona: "normal",
        useWebSearch: false
      };


      // File
      if (selectedFile) {

        payload.file = {
          name: selectedFile.name,
          type: selectedFile.type,
          data: selectedFile.data
        };

      }


      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(payload)

      });


      let data = {};

      try {
        data = await response.json();
      } catch (e) {
        data = {};
      }


      // Remove typing
      typingWrapper.remove();


      if (!response.ok) {

        const errorMessage =
          data.error ||
          "Server error. Please check your Vercel API settings.";

        messages.push({
          role: "assistant",
          content: "❌ " + errorMessage
        });

        addMessageToScreen(
          "assistant",
          "❌ " + errorMessage
        );

      } else {

        const answer =
          data.answer ||
          "I couldn't generate a response.";

        messages.push({
          role: "assistant",
          content: answer
        });

        addMessageToScreen(
          "assistant",
          answer
        );

      }


      saveHistory();
      renderHistory();

    } catch (error) {

      typingWrapper.remove();

      const errorText =
        "❌ Connection error. Please check your internet connection and Vercel deployment.";

      messages.push({
        role: "assistant",
        content: errorText
      });

      addMessageToScreen(
        "assistant",
        errorText
      );

      saveHistory();

    } finally {

      isSending = false;
      sendBtn.disabled = false;

      selectedFile = null;
      fileInput.value = "";
      fileName.textContent = "";

      input.focus();

    }
  }


  // ==============================
  // SEND BUTTON
  // ==============================

  sendBtn.addEventListener("click", function() {
    sendMessage();
  });


  // ==============================
  // ENTER KEY
  // ==============================

  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      sendMessage();

    }

  });


  // ==============================
  // NEW CHAT
  // ==============================

  newChatBtn.addEventListener("click", function() {

    messages = [];

    localStorage.removeItem("crazyAssistantMessages");

    selectedFile = null;

    fileInput.value = "";

    fileName.textContent = "";

    renderChat();

    input.focus();

  });


  // ==============================
  // FILE UPLOAD
  // ==============================

  fileInput.addEventListener("change", function() {

    const file = fileInput.files[0];

    if (!file) return;

    // Limit browser-side file size
    if (file.size > 8 * 1024 * 1024) {

      alert("File is too large. Please select a file under 8 MB.");

      fileInput.value = "";

      return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

      selectedFile = {
        name: file.name,
        type: file.type,
        data: event.target.result
      };

      fileName.textContent =
        "📎 " + file.name;

    };

    reader.readAsDataURL(file);

  });


  // ==============================
  // VOICE INPUT
  // ==============================

  let recognition = null;

  if (
    "SpeechRecognition" in window ||
    "webkitSpeechRecognition" in window
  ) {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;


    recognition.onstart = function() {
      voiceBtn.textContent = "🔴";
    };


    recognition.onend = function() {
      voiceBtn.textContent = "🎤";
    };


    recognition.onresult = function(event) {

      const transcript =
        event.results[0][0].transcript;

      input.value = transcript;

      input.focus();

    };


    recognition.onerror = function() {
      voiceBtn.textContent = "🎤";
    };


    voiceBtn.addEventListener("click", function() {

      try {
        recognition.start();
      } catch (error) {
        // Already running
      }

    });

  } else {

    voiceBtn.addEventListener("click", function() {

      alert(
        "Voice input is not supported by this browser."
      );

    });

  }


  // ==============================
  // CHAT HISTORY
  // ==============================

  function renderHistory() {

    historyBox.innerHTML = "";

    if (messages.length === 0) {
      return;
    }

    const userMessages =
      messages.filter(function(item) {
        return item.role === "user";
      });


    userMessages.forEach(function(item) {

      const div =
        document.createElement("div");

      div.className = "history-item";

      div.textContent =
        item.content.substring(0, 35);

      historyBox.appendChild(div);

    });

  }


  // ==============================
  // START
  // ==============================

  loadHistory();
  renderHistory();

  input.focus();

</script>

</body>
</html>
